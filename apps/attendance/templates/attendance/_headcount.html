<hr class="my-4">
<h2 class="h4">到班人數 <small class="text-muted fs-6">{{ date|date:"Y-m-d" }}，點數字可以看名單{% if is_today %}，在名單上可以勾選多人一次上班、下班{% endif %}</small></h2>

<div class="row g-3" style="max-width: 44rem;">
  {% with base=date|date:"Y-m-d" %}
    <div class="col-6 col-sm-3"><a class="card text-center text-decoration-none h-100" href="{% url 'attendance:list' %}?date={{ base }}&kind=expected"><div class="card-body"><div class="text-muted">應到</div><div class="display-6">{{ summary.expected }}</div><div class="small text-muted">在職人員</div></div></a></div>
    <div class="col-6 col-sm-3"><a class="card text-center text-decoration-none h-100 border-success" href="{% url 'attendance:list' %}?date={{ base }}&kind=arrived"><div class="card-body"><div class="text-muted">實到</div><div class="display-6 text-success">{{ summary.arrived }}</div><div class="small text-muted">有打上班卡</div></div></a></div>
    <div class="col-6 col-sm-3"><a class="card text-center text-decoration-none h-100{% if summary.missing %} border-danger{% endif %}" href="{% url 'attendance:list' %}?date={{ base }}&kind=missing"><div class="card-body"><div class="text-muted">未到</div><div class="display-6{% if summary.missing %} text-danger{% endif %}">{{ summary.missing }}</div><div class="small text-muted">請假、缺勤、未打卡</div></div></a></div>
    {% if is_today %}<div class="col-6 col-sm-3"><a class="card text-center text-decoration-none h-100" href="{% url 'attendance:list' %}?date={{ base }}&kind=on_site"><div class="card-body"><div class="text-muted">目前在場</div><div class="display-6">{{ summary.on_site }}</div><div class="small text-muted">排工位看這個</div></div></a></div>{% endif %}
  {% endwith %}
</div>
